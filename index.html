<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tag Mania</title>
    
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="icon" sizes="192x192" href="favicon.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="frontend/css/style.css">

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <script>
        // FOOL-PROOF INTERCEPTOR: Safe capture after Socket.IO script loads
        let gameSocket = null;
        const originalIo = window.io;
        if (typeof originalIo === 'function') {
            window.io = function(...args) {
                const instance = originalIo(...args);
                gameSocket = instance;
                return instance;
            };
        }
    </script>
</head>
<body>

    <div id="login-screen">
        <h1>Tag Mania</h1>
        <div class="server-status-wrapper" id="menu-status-label"><i class="fa-solid fa-plug"></i> CONNECTING TO ARENA SERVER...</div>
        
        <label for="username-input">CHOOSE PLAYER USERNAME</label>
        <input type="text" id="username-input" placeholder="Enter player name..." maxlength="30" autocomplete="off">
        
        <label for="color-picker">CUSTOM IN-GAME AVATAR COLOR</label>
        <input type="color" id="color-picker" value="#007bff">
        
        <button id="start-btn" disabled>Waiting for Server...</button>
    </div>

    <div id="game-container">
        <i class="fa-solid fa-robot" style="position: absolute; opacity: 0; pointer-events: none;" aria-hidden="true"></i>
        <i class="fa-solid fa-crown" style="position: absolute; opacity: 0; pointer-events: none;" aria-hidden="true"></i>
        <i class="fa-solid fa-snowflake" style="position: absolute; opacity: 0; pointer-events: none;" aria-hidden="true"></i>

        <div id="notification-box"></div>
        <div id="status-box">Connecting...</div>
        <canvas id="gameCanvas"></canvas>
        <div id="joystick-zone">
            <div id="joystick-stick"></div>
        </div>
    </div>

    <script src="frontend/js/game.js"></script>
    
    <script>
        let isReadyToJoin = false;

        document.getElementById('start-btn').addEventListener('click', (e) => {
            if (!isReadyToJoin) {
                e.preventDefault();
                return false;
            }
            clearInterval(statusCheckInterval);
            document.getElementById('login-screen').style.setProperty('display', 'none', 'important');
            document.getElementById('game-container').style.setProperty('display', 'flex', 'important');
        });

        const statusCheckInterval = setInterval(() => {
            const startBtn = document.getElementById('start-btn');
            const menuStatus = document.getElementById('menu-status-label');
            
            if (!startBtn || !menuStatus) return;

            let isConnected = false;

            if (gameSocket) {
                if (gameSocket.connected || (gameSocket.io && gameSocket.io.readyState === 'open')) {
                    isConnected = true;
                }
            }

            if (isConnected) {
                isReadyToJoin = true;
                startBtn.removeAttribute('disabled');
                
                // Force button text over game.js resets
                startBtn.innerText = "Join Arena";
                
                menuStatus.innerHTML = '<i class="fa-solid fa-circle-check"></i> SERVER READY';
                menuStatus.style.color = "#00ffcc";
                menuStatus.style.background = "rgba(0, 255, 204, 0.1)";
                menuStatus.style.borderColor = "rgba(0, 255, 204, 0.3)";
            } else {
                isReadyToJoin = false;
                startBtn.setAttribute('disabled', 'true');
                startBtn.innerText = "Waiting for Server...";
                
                menuStatus.innerHTML = '<i class="fa-solid fa-plug"></i> CONNECTING TO ARENA SERVER...';
                menuStatus.style.color = "#ffc107";
                menuStatus.style.background = "rgba(255, 193, 7, 0.1)";
                menuStatus.style.borderColor = "rgba(255, 193, 7, 0.3)";
                // Note: no manual gameSocket.connect() call here on purpose.
                // Socket.IO already auto-connects and auto-reconnects with
                // its own backoff; forcing .connect() on every 300ms tick
                // was interrupting in-flight handshakes and causing the
                // connect/disconnect flicker.
            }
        }, 300); // Faster refresh window to completely stomp over the background file loops
    </script>
    <script>
        // Interactive glow: tracks cursor position over the sign-in card
        // and feeds it into the --mx/--my custom properties the CSS glow
        // reads from. Scoped to #login-screen only — doesn't touch
        // anything in-game.
        (function () {
            const card = document.getElementById('login-screen');
            if (!card) return;

            function updateGlow(clientX, clientY) {
                const rect = card.getBoundingClientRect();
                const x = clientX - rect.left;
                const y = clientY - rect.top;
                card.style.setProperty('--mx', `${x}px`);
                card.style.setProperty('--my', `${y}px`);
            }

            card.addEventListener('mousemove', (e) => {
                updateGlow(e.clientX, e.clientY);
            });

            card.addEventListener('touchmove', (e) => {
                const touch = e.touches[0];
                if (!touch) return;
                updateGlow(touch.clientX, touch.clientY);
            }, { passive: true });
        })();
    </script>
</body>
</html>
